[package]
name = "cue-netrender"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Retained Netrender scenes on a Cue host device with private quality state"
license.workspace = true
publish = false

[lib]
name = "wgpu_cue_netrender"

[features]
default = []
scene-profile = ["scene-jobs"]
scene-jobs = ["netrender/serde", "dep:serde_json"]
cpu = ["scene-jobs", "netrender/vello-cpu"]
hybrid = ["scene-jobs", "netrender/vello-hybrid"]

[dependencies]
webcue = "=0.1.2"
wgpu-cue = "=0.1.3"
netrender = { git = "https://github.com/merely-made/netrender.git", rev = "79c9487ba9fc23daeee60f235ba4d3f1cbc1594d", version = "=0.1.2" }
serde_json = { version = "=1.0.154", optional = true }
