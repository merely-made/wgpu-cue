[package]
name = "wgpu-cue"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "../../README.md"
description = "Host-device presentation and owned native-frame integration for Webcue surfaces"
[dependencies]
webcue.workspace = true
wgpu.workspace = true
[dev-dependencies]
pollster = "1"

[target.'cfg(target_os = "macos")'.dependencies]
grafting = {version = "=0.6.1", default-features = false, features = ["wgpu-30"]}
dpi = "0.1"
objc2-metal = "0.3.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
grafting = {version = "=0.6.1", default-features = false, features = ["wgpu-30", "surfman"]}
glow = "0.17"
surfman = "0.14"
euclid = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
grafting = {version = "=0.6.1", default-features = false, features = ["wgpu-30"]}
dpi = "0.1"
