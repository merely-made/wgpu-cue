[workspace]
resolver = "3"
members = ["crates/webcue", "crates/wgpu-cue", "adapters/genet", "adapters/scry", "adapters/netrender", "support/execution-proof"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.97.1"
license = "MPL-2.0"
authors = ["Mark AB (markik)"]
repository = "https://github.com/merely-made/wgpu-cue"

[workspace.dependencies]
webcue = { version = "=0.1.3", path = "crates/webcue" }
grafting-frame = { git = "https://github.com/merely-made/wgpu-graft.git", branch = "main" }
accesskit = { version = "=0.25.1", features = ["serde"] }
document-session-api = "=0.1.2"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "metal", "vulkan", "dx12"] }

[patch.crates-io]
webcue = { path = "crates/webcue" }
wgpu-cue = { path = "crates/wgpu-cue" }
document-session-api = { git = "https://github.com/merely-made/genet.git", branch = "main" }
