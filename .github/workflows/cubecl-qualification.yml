name: Previous CubeCL device control
on:
  push:
    branches: [qualify/cubecl-previous-20261120]
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: [{"name": "matmul", "repo": "merely-made/graphshell", "sha": "9e9533804037d9d21264bfd6b252a69435597df0", "sub": "host/support/patches/cubek-matmul"}]
    runs-on: macos-15
    timeout-minutes: 70
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - working-directory: ${{ matrix.sub }}
        shell: bash
        run: |
          cargo +1.99.1 generate-lockfile
          python3 - <<'PINS'
          import tomllib
          from pathlib import Path
          data=tomllib.loads(Path("Cargo.lock").read_text())
          packages=sorted({p["name"] for p in data["package"] if p["name"].startswith("cubecl") and p["version"]=="0.11.4"})
          with Path("Cargo.toml").open("a") as f:
              for n in packages:
                  f.write('\n[dev-dependencies.control-'+n+']\npackage = "'+n+'"\nversion = "=0.11.3"\ndefault-features = false\n')
          PINS
          cargo +1.99.1 test --features cpu-reference cmma_tiled_weight_names_the_stage_across_m
